<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SDU-ISCMS</title>
    <link rel="stylesheet" href="login.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="logo-section">
                <img src="../Img/Logo.png" alt="SDU Logo" class="main-logo">
                <h2>SOCIAL DEVELOPMENT UNIT</h2>
                <p>Integrated Staff Capacity Management System (ISCMS)</p>
            </div>

            <form class="login-form" id="loginPanel">
                <div class="input-group">
                    <label>EMAIL:</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="emailInput" placeholder="Type your email here">
                    </div>
                </div>

                <div class="input-group">
                    <label>PASSWORD:</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="passwordInput" placeholder="Type your password here">
                        <i data-lucide="eye-off" class="eye-icon"></i>
                    </div>
                </div>

                <button type="button" id="loginBtn" class="login-btn">Login</button>
            </form>

            <form class="login-form form-panel--hidden" id="signupPanel">
                <div class="input-group">
                    <label>FULL NAME:</label>
                    <div class="input-wrapper">
                        <i data-lucide="user"></i>
                        <input type="text" id="signupName" placeholder="Your full name" autocomplete="name">
                    </div>
                </div>

                <div class="input-group">
                    <label>EMAIL:</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="signupEmail" placeholder="Your institutional email" autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label>PASSWORD:</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password" autocomplete="new-password">
                    </div>
                </div>

                <div class="input-group">
                    <label>OFFICE:</label>
                    <div class="input-wrapper input-wrapper--select">
                        <i data-lucide="building-2"></i>
                        <select id="signupOffice" aria-label="Office">
                            <option value="" disabled selected>Select your office</option>
                            <option value="SDU">SDU — Social Development Unit</option>
                            <option value="ACCA">ACCA</option>
                            <option value="ACES">ACES</option>
                            <option value="ACLG">ACLG</option>
                            <option value="APC">APC</option>
                            <option value="CCES">CCES</option>
                            <option value="ALTEC">ALTEC</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="signupBtn" class="login-btn">Sign up</button>
            </form>

            <div class="footer-links" id="footerLogin">
                Don't have an account? <a href="#" id="showSignupLink">Register here!</a>
            </div>
            <div class="footer-links form-panel--hidden" id="footerSignup">
                Already have an account? <a href="#" id="showLoginLink">Log in</a>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="approvalModal" role="dialog" aria-modal="true" aria-labelledby="approvalModalTitle" hidden>
        <div class="modal-card">
            <div class="modal-icon-wrap" aria-hidden="true">
                <i data-lucide="clock"></i>
            </div>
            <h3 id="approvalModalTitle">Awaiting director approval</h3>
            <p class="modal-text">Your registration has been recorded. Please wait for your approval from the SDU Director before you can access the system.</p>
            <button type="button" id="approvalModalOk" class="modal-btn">OK</button>
        </div>
    </div>

    <script>
        // 1. Initialize Icons immediately
        lucide.createIcons();

        function refreshIcons() {
            lucide.createIcons();
        }

        const loginPanel = document.getElementById('loginPanel');
        const signupPanel = document.getElementById('signupPanel');
        const footerLogin = document.getElementById('footerLogin');
        const footerSignup = document.getElementById('footerSignup');
        const approvalModal = document.getElementById('approvalModal');

        function showLoginView(e) {
            if (e) e.preventDefault();
            loginPanel.classList.remove('form-panel--hidden');
            signupPanel.classList.add('form-panel--hidden');
            footerLogin.classList.remove('form-panel--hidden');
            footerSignup.classList.add('form-panel--hidden');
        }

        function showSignupView(e) {
            if (e) e.preventDefault();
            loginPanel.classList.add('form-panel--hidden');
            signupPanel.classList.remove('form-panel--hidden');
            footerLogin.classList.add('form-panel--hidden');
            footerSignup.classList.remove('form-panel--hidden');
            refreshIcons();
        }

        document.getElementById('showSignupLink').addEventListener('click', showSignupView);
        document.getElementById('showLoginLink').addEventListener('click', showLoginView);

        document.getElementById('signupBtn').addEventListener('click', function () {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const office = document.getElementById('signupOffice').value;

            if (!name) {
                alert('Please enter your full name.');
                return;
            }
            if (!email) {
                alert('Please enter your email.');
                return;
            }
            if (!password) {
                alert('Please enter a password.');
                return;
            }
            if (!office) {
                alert('Please select your office.');
                return;
            }

            approvalModal.hidden = false;
            refreshIcons();
        });

        document.getElementById('approvalModalOk').addEventListener('click', function () {
            approvalModal.hidden = true;
            document.getElementById('signupName').value = '';
            document.getElementById('signupEmail').value = '';
            document.getElementById('signupPassword').value = '';
            document.getElementById('signupOffice').selectedIndex = 0;
            showLoginView();
            refreshIcons();
        });

        approvalModal.addEventListener('click', function (ev) {
            if (ev.target === approvalModal) {
                document.getElementById('approvalModalOk').click();
            }
        });

        // 2. Routing Logic
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('emailInput').value.toLowerCase().trim();
            
            console.log("Login clicked. Email entered:", email); // This helps you debug in Inspect > Console

            if (email === "director@adzu.edu.ph") {
                window.location.href = "../director/dashboard.html";
            } 
            else if (email === "staff@adzu.edu.ph") {
                window.location.href = "../staff/staff.html";
            } 
            else if (email === "officehead@adzu.edu.ph") {
                window.location.href = "../officehead/dashboard.html";
            } 
            else if (email === "") {
                alert("Please enter an email.");
            }
            else {
                alert("Invalid account. Try: director@adzu.edu.ph");
            }
        });

        // Allow Enter Key — submit whichever panel is visible
        document.addEventListener('keypress', function (e) {
            if (e.key !== 'Enter') return;
            if (!approvalModal.hidden) return;
            if (signupPanel.classList.contains('form-panel--hidden')) {
                document.getElementById('loginBtn').click();
            } else {
                document.getElementById('signupBtn').click();
            }
        });
    </script>
</body>
</html>
