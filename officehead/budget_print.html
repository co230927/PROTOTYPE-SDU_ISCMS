<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Print View | SDU-ISCMS — Office Head</title>
    <link rel="stylesheet" href="../director/dashboard.css">
    <style>
        body.print-budget-page {
            background: #f4f7fe;
            margin: 0;
            font-family: Montserrat, 'Segoe UI', sans-serif;
        }
        .print-shell {
            max-width: 820px;
            margin: 24px auto;
            padding: 28px 32px;
            background: #fff;
            border: 5px solid #1A237E;
            border-radius: 12px;
        }
        .print-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .print-header h1 { margin: 0 0 6px; color: #1B2559; font-size: 1.35rem; }
        .print-header p { margin: 0; color: #64748b; font-size: 0.9rem; }
        .print-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .print-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        .print-summary .cell {
            background: #f8fafc;
            border-radius: 10px;
            padding: 14px;
        }
        .print-summary .cell span {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 6px;
        }
        .print-summary .cell strong { font-size: 1.15rem; color: #1B2559; }
        .warn-inline {
            display: inline-block;
            margin-left: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            background: #fee2e2;
            color: #b91c1c;
        }
        table.print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table.print-table th,
        table.print-table td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
        }
        table.print-table th {
            color: #707EAE;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }
        .empty-note { color: #64748b; font-size: 0.9rem; }
        @media print {
            body.print-budget-page { background: #fff; }
            .print-shell { margin: 0; border: none; border-radius: 0; max-width: none; box-shadow: none; }
            .print-actions { display: none !important; }
            .navy-frame { border: none !important; }
        }
    </style>
</head>
<body class="print-budget-page">
    <div class="print-shell navy-frame shadow-lg">
        <div class="print-header">
            <div>
                <h1 id="printEventTitle">Event Budget Breakdown</h1>
                <p>SDU-ISCMS · Office Head print view</p>
            </div>
            <div class="print-actions">
                <button type="button" class="btn-viewmore" onclick="window.close()">Close</button>
                <button type="button" class="btn-accept" onclick="window.print()">Print</button>
            </div>
        </div>
        <div id="printBody"><p class="empty-note">Loading…</p></div>
    </div>

    <script src="../js/budget_data.js"></script>
    <script>
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function render() {
            const params = new URLSearchParams(window.location.search);
            const eventId = params.get('eventId') || 'tevt-001';
            const budget = getEventBudget(eventId);
            const body = document.getElementById('printBody');
            if (!budget) {
                document.getElementById('printEventTitle').textContent = 'Budget not found';
                body.innerHTML = '<p class="empty-note">No budget data for this event id.</p>';
                return;
            }
            document.getElementById('printEventTitle').textContent = budget.eventName;
            const warn = budget.overThreshold
                ? '<span class="warn-inline">Spent ≥ 80% of allocated</span>'
                : '';
            const expenseRows = (budget.expenses || []).map((e) => `
                <tr>
                    <td>${escapeHtml(e.description)}</td>
                    <td>${escapeHtml(e.loggedBy || '—')}</td>
                    <td>${escapeHtml(e.loggedAt || '—')}</td>
                    <td style="text-align:right;font-weight:700;">${formatPeso(e.amount)}</td>
                </tr>
            `).join('');
            const fundingRows = (budget.fundingSources || []).map((f) => `
                <tr>
                    <td>${escapeHtml(f.partnerName)}</td>
                    <td>${escapeHtml(f.type || '—')}</td>
                    <td style="text-align:right;font-weight:700;">${formatPeso(f.amount)}</td>
                </tr>
            `).join('');
            body.innerHTML = `
                <div class="print-summary">
                    <div class="cell"><span>Allocated</span><strong>${formatPeso(budget.allocated)}</strong></div>
                    <div class="cell"><span>Spent</span><strong>${formatPeso(budget.spent)}</strong>${warn}</div>
                    <div class="cell"><span>Remaining</span><strong>${formatPeso(budget.remaining)}</strong></div>
                </div>
                <h3 style="margin:0 0 10px;color:#1B2559;font-size:1rem;">Funding sources</h3>
                <table class="print-table">
                    <thead><tr><th>PARTNER</th><th>TYPE</th><th style="text-align:right;">AMOUNT</th></tr></thead>
                    <tbody>${fundingRows || '<tr><td colspan="3">No partner funding on this event.</td></tr>'}</tbody>
                </table>
                <h3 style="margin:0 0 10px;color:#1B2559;font-size:1rem;">Logged expenses</h3>
                <table class="print-table">
                    <thead><tr><th>DESCRIPTION</th><th>LOGGED BY</th><th>DATE</th><th style="text-align:right;">AMOUNT</th></tr></thead>
                    <tbody>${expenseRows || '<tr><td colspan="4">No expenses logged.</td></tr>'}</tbody>
                </table>
            `;
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
